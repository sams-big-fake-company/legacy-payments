server:
  port: 8080

spring:
  application:
    name: legacy-payments
  
  # H2 in-memory database for development
  datasource:
    url: jdbc:h2:mem:payments;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: 
    driver-class-name: org.h2.Driver
  
  h2:
    console:
      enabled: true
      path: /h2-console
  
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect
  
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

# Logging
logging:
  level:
    root: INFO
    com.bigfake.payments: DEBUG
    org.hibernate.SQL: DEBUG
    org.springframework.security: INFO

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

# Custom application properties
# TODO: PAY-3210 - Move business rules to config
app:
  payment:
    max-retry-attempts: 3
    gateway-timeout-ms: 5000
